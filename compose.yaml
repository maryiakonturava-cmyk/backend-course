services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: groupa1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d groupa1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: src/FEDept.BackendCourse.GroupA1.Api.Template/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__ApplyMigrations: "true"
      ConnectionStrings__Default: Host=db;Port=5432;Database=groupa1;Username=postgres;Password=postgres
    ports:
      - "${API_PORT:-5117}:8080"

volumes:
  postgres-data:
