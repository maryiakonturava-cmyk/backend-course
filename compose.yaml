services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: groupa1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d groupa1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: src/FEDept.BackendCourse.GroupA1.Api.Template/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__ApplyMigrations: "true"
      ConnectionStrings__Default: Host=db;Port=5432;Database=groupa1;Username=postgres;Password=postgres
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      # Empty keys only allow other services to start; API startup validation still fails fast.
      Jwt__AccessSecret: ${JWT_ACCESS_SECRET:-}
      Jwt__RefreshSecret: ${JWT_REFRESH_SECRET:-}
      Login__ChallengeHmacKey: ${LOGIN_CHALLENGE_HMAC_KEY:-}
      Login__AuditHmacKey: ${LOGIN_AUDIT_HMAC_KEY:-}
    ports:
      - "${API_PORT:-5117}:8080"

volumes:
  postgres-data:
