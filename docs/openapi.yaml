openapi: 3.1.1
info:
  title: Registration and Authentication API
  version: 1.0.0
  description: >-
    HTTP contract for the application's health, account-registration and sign-in endpoints.
    Registration confirmation is controlled by server configuration.
servers:
  - url: http://localhost:{port}
    description: Local development API
    variables:
      port:
        default: '5117'
        description: Set to the Docker Compose API_PORT value when overriding the default.
tags:
  - name: Health
  - name: Registration
  - name: Authentication
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check API health
      responses:
        '200':
          description: API is running. Response has no body.
  /auth/register:
    post:
      tags: [Registration]
      operationId: register
      summary: Register an account
      description: >-
        Creates an active account when confirmation is disabled, or a pending account
        and sends an OTP or a magic link when confirmation is enabled. A duplicate email returns
        409 without account details. The default rate limit is 5 requests per client
        IP per minute; server configuration can change the permit count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: user@example.com
              password: abc12345
      responses:
        '201':
          description: Account created and active; returned only when confirmation is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
              example:
                id: 2c4f09ad-610b-4c89-9c35-6df3ab02dbb9
                email: user@example.com
                status: active
        '202':
          description: >-
            Confirmation is required; an OTP or a magic link (server setting) was sent to the
            supplied email address. The secret is never part of the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationRequiredResponse'
              example:
                confirmationRequired: true
                method: otp
                attemptId: 2c4f09ad-610b-4c89-9c35-6df3ab02dbb9
                expiresInSeconds: 600
                resendAfterSeconds: 60
        '400':
          $ref: '#/components/responses/HttpsRequired'
          description: Некорректный email или пароль не проходит политику.
        '409':
          description: Email уже зарегистрирован или ожидает подтверждения.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.10
                title: Conflict
                status: 409
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Письмо не отправлено. Запись pending и попытка подтверждения сохранены.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /auth/register/resend:
    post:
      tags: [Registration]
      operationId: resendRegistrationCode
      summary: Resend registration confirmation
      description: >-
        Sends a new OTP or magic link for a pending account, using the method the attempt
        was issued with (not the current server setting). The previous code or link stops
        working. A successful resend resets expiry to 600 seconds and the failed-confirmation
        count to zero. The default rate limit is 5 requests per client IP per minute; the per-email
        resend cooldown is 60 seconds. Server configuration can change the permit count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendRequest'
            example:
              email: user@example.com
      responses:
        '202':
          description: A new OTP or magic link was sent, matching the attempt's method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationRequiredResponse'
        '400':
          $ref: '#/components/responses/HttpsRequired'
          description: Некорректный email.
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '404':
          description: Ожидающая регистрация для этого email не найдена.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: >-
            Returned for the per-email resend cooldown or the IP limit. IP limiter responses include
            RetryAfterResponse and the Retry-After header. The default IP limit is 5 requests per minute.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryAfterResponse'
        '503':
          description: Письмо не отправлено. Запись pending и попытка подтверждения сохранены.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /auth/register/confirm:
    post:
      tags: [Registration]
      operationId: confirmRegistration
      summary: Confirm registration with OTP or magic link token
      description: >-
        Activates the pending account. Send either the attempt ID and OTP, or the
        magic link token. Both expire after 600 seconds. Five failed code submissions
        consume an OTP attempt; a magic link token is single-use. Opening the link
        itself changes nothing; only this POST activates the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
            examples:
              otp:
                summary: OTP
                value:
                  attemptId: 2c4f09ad-610b-4c89-9c35-6df3ab02dbb9
                  code: '012345'
              magicLink:
                summary: Magic link token
                value:
                  token: q3Jx0dW9b6m1rQyZ4kFv8sT2nE7pL5cA0hG3uY6iO9w
      responses:
        '200':
          description: Registration confirmed and account activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
              example:
                id: 2c4f09ad-610b-4c89-9c35-6df3ab02dbb9
                email: user@example.com
                status: active
        '400':
          $ref: '#/components/responses/HttpsRequired'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '429':
          description: >-
            Exhausted OTP attempts return 429; IP rate-limit rejections include RetryAfterResponse
            and Retry-After.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryAfterResponse'
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in with email and password
      description: >-
        Signs in directly (204 with access_token and refresh_token cookies) or, when the server
        enables sign-in confirmation, sends an OTP or a magic link and returns 202. Unknown email,
        wrong password and any non-active status return the same 401. The IP limit defaults to 30
        requests per minute; failed checks are limited to 5 per email and IP per 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Signed in. Sets both cookies; no body.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
        '202':
          description: Confirmation required; the secret was sent by email only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginChallengeResponse'
        '400':
          $ref: '#/components/responses/LoginBadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '429':
          $ref: '#/components/responses/RetryAfter'
        '503':
          description: Database, token signing or SMTP unavailable. SMTP failure keeps the attempt and returns its ID.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginChallengeFailedResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
  /auth/login/confirm:
    post:
      tags: [Authentication]
      operationId: confirmLogin
      summary: Confirm sign-in with an OTP or a magic-link token
      description: >-
        OTP allows 5 entries; the fifth incorrect entry consumes the attempt and the next one returns 429.
        A magic-link page reads the token from the URL fragment and posts it here; GET never confirms.
        A malformed JSON body returns ValidationProblemDetails without echoing input; rejected challenges
        return ErrorResponse with invalid_challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginConfirmRequest'
      responses:
        '204':
          description: Signed in. Sets both cookies; no body.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
        '400':
          $ref: '#/components/responses/AuthenticationBadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '429':
          description: All 5 OTP entries were used. No Retry-After header; sign in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: too_many_requests
                message: Too many incorrect codes. Sign in again.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/login/resend:
    post:
      tags: [Authentication]
      operationId: resendLogin
      summary: Send a new code or link for an attempt
      description: >-
        Allowed 60 seconds after the last send, also after expiry. Keeps the attempt's method,
        replaces the secret and resets the OTP counter. Malformed JSON returns ValidationProblemDetails
        without echoing input; rejected challenges return ErrorResponse with invalid_challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginResendRequest'
      responses:
        '202':
          description: New secret sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResendResponse'
        '400':
          $ref: '#/components/responses/AuthenticationBadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '429':
          description: Cooldown has Retry-After; exhausted OTP entries do not.
          headers:
            Retry-After:
              description: Cooldown only; exhausted attempts omit this header.
              schema:
                type: integer
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/RetryAfterResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
              examples:
                cooldown:
                  value:
                    code: too_many_requests
                    message: Too many requests. Try again later.
                    retryAfterSeconds: 60
                exhausted:
                  value:
                    code: too_many_requests
                    message: Too many incorrect codes. Sign in again.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Issue a new token pair from the refresh cookie
      description: >-
        Reads only the refresh_token cookie. The used refresh token is not revoked and stays valid
        until its own exp. The rate limit defaults to 30 requests per IP per minute.
      responses:
        '204':
          description: New pair set in both cookies; no body.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookies'
        '400':
          $ref: '#/components/responses/HttpsRequired'
        '401':
          $ref: '#/components/responses/InvalidSession'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '429':
          $ref: '#/components/responses/RetryAfter'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Clear both session cookies
      description: Needs no valid token. Does not revoke copies of the refresh token on other devices.
      responses:
        '204':
          description: Both cookies cleared with empty values and Max-Age=0; no body.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedSessionCookies'
        '400':
          $ref: '#/components/responses/HttpsRequired'
        '403':
          $ref: '#/components/responses/CsrfRejected'
components:
  headers:
    SessionCookies:
      description: >-
        access_token (HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=900) and
        refresh_token (HttpOnly; Secure; SameSite=Strict; Path=/auth/refresh; Max-Age=2592000), no Domain.
        A cross-site frontend configuration uses SameSite=None.
      schema:
        type: string
    ClearedSessionCookies:
      description: >-
        Clears both cookies with an empty value and Max-Age=0. Each keeps its original Path
        (access_token /, refresh_token /auth/refresh) and configured SameSite value.
      schema:
        type: string
  responses:
    ValidationError:
      description: Некорректные данные запроса.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          example:
            type: https://tools.ietf.org/html/rfc9110#section-15.5.1
            title: One or more validation errors occurred.
            status: 400
            errors:
              password:
                - Password must be at least 8 characters, include a letter and a digit, and use no more than 72 UTF-8 bytes.
    RateLimited:
      description: Registration IP limit exceeded; default is 5 requests per minute.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RetryAfterResponse'
          example:
            code: too_many_requests
            message: Too many requests. Try again later.
            retryAfterSeconds: 60
    InvalidCredentials:
      description: Unknown email, wrong password or inactive account; one identical response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: invalid_credentials
            message: Email or password is incorrect.
    InvalidSession:
      description: Missing, invalid or expired token, wrong token type, or inactive user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: invalid_session
            message: The session is missing or no longer valid.
    AuthenticationBadRequest:
      description: >-
        Malformed or invalid body returns ValidationProblemDetails without echoing input;
        rejected challenges return ErrorResponse with invalid_challenge. In non-Development
        environments, plain HTTP auth requests return https_required before the body is read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidChallenge:
              value:
                code: invalid_challenge
                message: The code or link is invalid or expired.
            httpsRequired:
              value:
                code: https_required
                message: Use HTTPS.
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    HttpsRequired:
      description: >-
        Plain HTTP requests to /auth/* are rejected outside Development before reading the body.
        Malformed requests may return ValidationProblemDetails; invalid registration challenges may return an empty 400.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: https_required
            message: Use HTTPS.
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    LoginBadRequest:
      description: Malformed request JSON returns ValidationProblemDetails; plain HTTP returns https_required outside Development.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - type: object
                properties:
                  code:
                    const: https_required
                  message:
                    const: Use HTTPS.
          example:
            code: https_required
            message: Use HTTPS.
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    CsrfRejected:
      description: Untrusted Origin, or a trusted cross-origin request without X-CSRF-Protection 1.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: csrf_rejected
            message: The request origin is not allowed.
    RetryAfter:
      description: >-
        IP and failed-login limit responses include Retry-After and retryAfterSeconds
        with the fixed message "Too many requests. Try again later."
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RetryAfterResponse'
          example:
            code: too_many_requests
            message: Too many requests. Try again later.
            retryAfterSeconds: 60
    ServiceUnavailable:
      description: Database, token signing or SMTP unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: service_unavailable
            message: The service is temporarily unavailable. Try again later.
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Email address. The server trims and lowercases it before use.
          example: user@example.com
        password:
          type: string
          minLength: 8
          description: >-
            Must contain at least one letter and one digit. Maximum length is 72
            UTF-8 bytes; this byte limit cannot be expressed by JSON Schema maxLength.
          example: abc12345
    ResendRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: Email address of the pending account.
          example: user@example.com
    ConfirmRequest:
      oneOf:
        - $ref: '#/components/schemas/ConfirmOtpRequest'
        - $ref: '#/components/schemas/ConfirmTokenRequest'
    ConfirmOtpRequest:
      type: object
      additionalProperties: false
      required: [attemptId, code]
      properties:
        attemptId:
          type: string
          format: uuid
          description: Confirmation attempt identifier returned by registration or resend.
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Six-digit OTP sent to the account email address.
    ConfirmTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: One-time token from the magic link query string (`?token=`).
    ConfirmationRequiredResponse:
      type: object
      additionalProperties: false
      required: [confirmationRequired, method, attemptId, expiresInSeconds, resendAfterSeconds]
      properties:
        confirmationRequired:
          type: boolean
          const: true
        method:
          type: string
          enum: [otp, magic_link]
        attemptId:
          type: string
          format: uuid
        expiresInSeconds:
          type: integer
          const: 600
        resendAfterSeconds:
          type: integer
          const: 60
    AccountResponse:
      type: object
      additionalProperties: false
      required: [id, email, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          const: active
    ProblemDetails:
      type: object
      description: ASP.NET Core ProblemDetails error response.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      additionalProperties: true
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          description: ASP.NET Core validation problem response.
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Trimmed and lowercased by the server.
        password:
          type: string
          description: Used exactly as sent.
    LoginConfirmRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [attemptId, code]
          properties:
            attemptId:
              type: string
              format: uuid
            code:
              type: string
              pattern: '^[0-9]{6}$'
        - type: object
          additionalProperties: false
          required: [token]
          properties:
            token:
              type: string
              description: '{attemptId}.{secret} from the magic-link URL fragment.'
              pattern: '^[0-9a-fA-F-]{36}\.[A-Za-z0-9_-]{43}$'
    LoginResendRequest:
      type: object
      required: [attemptId]
      properties:
        attemptId:
          type: string
          format: uuid
    LoginChallengeResponse:
      type: object
      required: [confirmationRequired, method, attemptId, expiresInSeconds, resendAfterSeconds]
      properties:
        confirmationRequired:
          type: boolean
          const: true
        method:
          type: string
          enum: [otp, magic_link]
        attemptId:
          type: string
          format: uuid
        expiresInSeconds:
          type: integer
          const: 600
        resendAfterSeconds:
          type: integer
          const: 60
    LoginChallengeFailedResponse:
      type: object
      required: [confirmationRequired, method, attemptId, retryAfterSeconds]
      properties:
        confirmationRequired:
          type: boolean
          const: true
        method:
          type: string
          enum: [otp, magic_link]
        attemptId:
          type: string
          format: uuid
        retryAfterSeconds:
          type: integer
    LoginResendResponse:
      type: object
      required: [method, attemptId, expiresInSeconds, resendAfterSeconds]
      properties:
        method:
          type: string
          enum: [otp, magic_link]
        attemptId:
          type: string
          format: uuid
        expiresInSeconds:
          type: integer
          const: 600
        resendAfterSeconds:
          type: integer
          const: 60
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_credentials, invalid_session, invalid_challenge, too_many_requests, csrf_rejected, https_required, service_unavailable]
        message:
          type: string
    RetryAfterResponse:
      type: object
      required: [code, message, retryAfterSeconds]
      properties:
        code:
          type: string
          const: too_many_requests
        message:
          type: string
        retryAfterSeconds:
          type: integer
